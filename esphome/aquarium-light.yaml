# Example ESPHome node for the Aquarium Lighting integration.
# Four PWM channels; the ESP does the per-step interpolation so a once-a-minute
# update from Home Assistant still produces a perfectly smooth fade.
#
# Pick ONE way for HA to reach it (set the same mode in the integration):
#   * ha_light      -> native `api:` below, integration calls light.turn_on
#   * esphome_rest  -> `web_server:` below, integration POSTs to /light/<id>/turn_on
#   * mqtt          -> uncomment the `mqtt:` block (and remove `api:`)

esphome:
  name: reef-light
  friendly_name: Reef Light

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Reef Light Fallback"
    password: !secret fallback_password

ota:
  - platform: esphome
    password: !secret ota_password

# --- transport: native API (mode "ha_light") ------------------------------
api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s        # don't reboot the lights just because HA is down

# --- transport: REST (mode "esphome_rest") --------------------------------
# Target in the integration:  http://reef-light.local/light/<id>
# Verify the exact path for your ESPHome version:
#   curl -X POST "http://reef-light.local/light/blue/turn_on?brightness=128&transition=5"
web_server:
  port: 80
  version: 3
  # auth:
  #   username: admin
  #   password: !secret web_password   # then use http://admin:pass@reef-light.local/light/blue

# --- transport: MQTT (mode "mqtt") ----------------------------------------
# Target in the integration:  reef-light/light/blue/command
# mqtt:
#   broker: !secret mqtt_broker
#   username: !secret mqtt_user
#   password: !secret mqtt_password
#   topic_prefix: reef-light

output:
  - platform: ledc
    id: pwm_blue
    pin: GPIO16
    frequency: 5000Hz      # match your LED driver's PWM dimming range
  - platform: ledc
    id: pwm_white
    pin: GPIO17
    frequency: 5000Hz
  - platform: ledc
    id: pwm_uv
    pin: GPIO18
    frequency: 5000Hz
  - platform: ledc
    id: pwm_warm_white
    pin: GPIO19
    frequency: 5000Hz

light:
  - platform: monochromatic
    name: "Blue"
    id: blue
    output: pwm_blue
    # Used whenever a command arrives WITHOUT its own transition (manual
    # on/off from the HA UI, power-up, etc.). The integration always sends an
    # explicit transition, which overrides this.
    default_transition_length: 60s
    gamma_correct: 2.2     # perceptually even steps across the range
    restore_mode: RESTORE_DEFAULT_ON

  - platform: monochromatic
    name: "White"
    id: white
    output: pwm_white
    default_transition_length: 60s
    gamma_correct: 2.2
    restore_mode: RESTORE_DEFAULT_ON

  - platform: monochromatic
    name: "UV"
    id: uv
    output: pwm_uv
    default_transition_length: 60s
    gamma_correct: 2.2
    restore_mode: RESTORE_DEFAULT_ON

  - platform: monochromatic
    name: "Warm White"
    id: warm_white
    output: pwm_warm_white
    default_transition_length: 60s
    gamma_correct: 2.2
    restore_mode: RESTORE_DEFAULT_ON
